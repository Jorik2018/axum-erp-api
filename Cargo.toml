[package]
name = "axum-erp-api"
version = "0.1.0"
edition = "2024"
default-run = "axum-erp-api"

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.44", features = ["serde"] }

deadpool-redis = { version = "0.23.0", features = ["rt_tokio_1", "tokio-rustls-comp"] }
redis = { version = "1.2.1", features = ["tokio-rustls-comp"] }

dotenv = "0.15.0"

serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "mysql", "macros", "uuid","chrono"] }
tokio = { version = "1.52.2", features = ["full"] }
tower-http = { version = "0.6.10", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.23.1", features = ["v4", "serde"] }
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
